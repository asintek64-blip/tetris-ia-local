<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tetris Móvil</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #0e1126;
    font-family: system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  .topbar { display: flex; gap: 6px; padding: 6px; align-items: center; flex-shrink: 0; }

  .panel {
    background: #1a1f3e;
    border-radius: 8px;
    padding: 4px 8px;
    color: #fff;
    text-align: center;
    min-width: 56px;
  }
  .panel .label { font-size: 9px; letter-spacing: 1px; color: #8fa0ff; }
  .panel .value { font-size: 16px; font-weight: 700; line-height: 1.2; }

  #nextPanel { flex: 0 0 auto; display: flex; align-items: center; gap: 4px; }
  #nextCanvas { width: 56px; height: 56px; image-rendering: pixelated; }

  .boardWrap {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #boardCanvas {
    aspect-ratio: 1 / 2;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 100%;
    display: block;
    border-radius: 6px;
    image-rendering: pixelated;
  }

  .controls {
    display: flex;
    gap: 8px;
    padding: 8px 12px 10px;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .btn {
    width: 56px;
    height: 56px;
    border: none;
    border-radius: 12px;
    background: #2a3170;
    color: #fff;
    font-size: 24px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .btn.active { background: #4a52c0; transform: scale(0.96); }

  .topbar .muteBtn {
    width: 38px; height: 38px; font-size: 18px; border-radius: 8px;
    background: #2a3170; color: #fff; cursor: pointer; flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }

  .overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(8,10,30,.72); z-index: 5; text-align: center; color: #fff;
  }
  .overlay.show { display: flex; }
  .overlay h1 { font-size: 34px; margin-bottom: 16px; }
  .overlay p { font-size: 15px; margin-bottom: 18px; color: #cfd4ff; }
  .overlay button {
    font-size: 18px; padding: 12px 30px; border-radius: 12px;
    border: none; background: #4a52c0; color: #fff; cursor: pointer;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="panel" id="scorePanel"><div class="label">PUNTOS</div><div class="value" id="scoreVal">0</div></div>
  <div class="panel" id="levelPanel"><div class="label">NIVEL</div><div class="value" id="levelVal">1</div></div>
  <div class="panel" id="nextPanel"><div class="label">SIGUIENTE</div><canvas id="nextCanvas" width="56" height="56"></canvas></div>
  <button class="topbar muteBtn" id="muteBtn" aria-label="Sonido">🔊</button>
</div>

<div class="boardWrap"><canvas id="boardCanvas" width="300" height="600"></canvas></div>

<div class="controls">
  <button class="btn" data-act="left" aria-label="Izquierda">◀</button>
  <button class="btn" data-act="down" aria-label="Abajo">▼</button>
  <button class="btn" data-act="right" aria-label="Derecha">▶</button>
  <button class="btn" data-act="rotate" aria-label="Rotar">↻</button>
</div>

<div class="overlay" id="pauseOverlay"><h1>PAUSA</h1><p>Pulsa P o toca el tablero para continuar</p></div>
<div class="overlay" id="gameoverOverlay"><h1>GAME OVER</h1><p id="finalScore">Puntuación final: 0</p><button id="restartBtn">REINICIAR</button></div>

<script>
(() => {
  "use strict";

  const COLS = 10, ROWS = 20, CELL = 30;
  const W = COLS * CELL, H = ROWS * CELL;
  const NEXT_W = 56, NEXT_H = 56;

  const SHAPES = {
    I: [[0,0],[1,0],[2,0],[3,0]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]],
    J: [[0,0],[0,1],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]]
  };

  const COLORS = { I:"#3ec9e8", O:"#f5c444", T:"#b46ae8", S:"#5ce87a", Z:"#e86a7a", J:"#5c7ae8", L:"#e8a044" };

  const boardCanvas = document.getElementById("boardCanvas");
  const nextCanvas = document.getElementById("nextCanvas");
  const ctx = boardCanvas.getContext("2d");
  const nctx = nextCanvas.getContext("2d");
  const scoreVal = document.getElementById("scoreVal");
  const levelVal = document.getElementById("levelVal");
  const pauseOverlay = document.getElementById("pauseOverlay");
  const gameoverOverlay = document.getElementById("gameoverOverlay");
  const finalScoreEl = document.getElementById("finalScore");
  const restartBtn = document.getElementById("restartBtn");
  const muteBtn = document.getElementById("muteBtn");

  let grid, piece, nextPiece, queue, score, level, dropCounter;
  let paused = false, gameOver = false, started = false;
  let lastTime = 0;
  let rafId = null;
  let holdTimer = null;
  const MUTE_KEY = "tetris_mute";

  // ---------- Audio (Web Audio API) ----------
  let audioCtx = null, muted = true;

  function ensureAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
  }

  function beep(freq, dur, type, vol) {
    if (muted || !audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type || "square";
    osc.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.12, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.06));
    osc.connect(g).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }

  function sfxMove() { beep(320, 0.05, "square", 0.08); }
  function sfxRotate() { beep(420, 0.06, "sine", 0.1); }
  function sfxLock() { beep(180, 0.09, "triangle", 0.12); }
  function sfxLine(n) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    for (let i = 0; i < n; i++) {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = 440 + i * 90;
      g.gain.setValueAtTime(0.1, t + i * 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.05 + 0.08);
      osc.connect(g).connect(audioCtx.destination);
      osc.start(t + i * 0.05);
      osc.stop(t + i * 0.05 + 0.1);
    }
  }
  function sfxGameover() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    [300, 240, 180].forEach((f, i) => {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.value = f;
      g.gain.setValueAtTime(0.12, t + i * 0.14);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.14 + 0.25);
      osc.connect(g).connect(audioCtx.destination);
      osc.start(t + i * 0.14);
      osc.stop(t + i * 0.14 + 0.3);
    });
  }

  muteBtn.addEventListener("click", () => { toggleMute(); });
  function toggleMute() {
    muted = !muted;
    muted && ensureAudio();
    try { localStorage.setItem(MUTE_KEY, String(muted)); } catch (e) {}
    muteBtn.textContent = muted ? "🔇" : "🔊";
  }
  try { if (localStorage.getItem(MUTE_KEY) === "true") { muted = true; muteBtn.textContent = "🔇"; } } catch (e) {}

  // ---------- Tetris logic ----------
  function dropInterval() {
    return Math.max(150, 1400 * Math.pow(0.92, level - 1));
  }

  function emptyGrid() {
    const g = [];
    for (let r = 0; r < ROWS; r++) { g.push(new Array(COLS).fill(null)); }
    return g;
  }

  function randPiece() {
    return Object.keys(SHAPES)[Math.floor(Math.random() * 7)];
  }

  function makePiece(type, col, row) {
    const cells = SHAPES[type];
    return { type, col, row, cells };
  }

  function collides(p, dx, dy) {
    for (const [cx, cy] of p.cells) {
      const x = p.col + cx + dx;
      const y = p.row + cy + dy;
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && grid[y][x]) return true;
    }
    return false;
  }

  function ghostRow(p) {
    let gy = p.row;
    while (!collides(p, 0, gy + 1)) gy++;
    return gy;
  }

  function lockPiece() {
    for (const [cx, cy] of piece.cells) {
      const y = piece.row + cy;
      if (y >= 0) grid[y][piece.col + cx] = piece.type;
    }
    sfxLock();
    clearLines();
    nextPiece = queue.shift() || randPiece();
    piece = makePiece(nextPiece, 3, -2);
    if (collides(piece, 0, 2)) { gameOverNow(); return; }
    drawNext();
  }

  function clearLines() {
    let lines = [];
    for (let r = ROWS - 1; r >= 0; r--) {
      if (grid[r].every(c => c !== null)) lines.push(r);
    }
    if (!lines.length) return;
    for (const r of lines) grid.splice(r, 1);
    while (grid.length < ROWS) grid.unshift(new Array(COLS).fill(null));
    const n = lines.length;
    score += [0, 40, 100, 300, 500][n];
    level = Math.floor(score / 1500) + 1;
    sfxLine(n);
    updateHud();
  }

  function canSpawn() {
    return !collides(makePiece(nextPiece, 3, -2), 0, 0);
  }

  function gameOverNow() {
    paused = false;
    gameOver = true;
    clearInterval(holdTimer);
    finalScoreEl.textContent = "Puntuación final: " + score;
    gameoverOverlay.classList.add("show");
    sfxGameover();
  }

  function pauseGame() {
    if (gameOver) return;
    paused = true;
    clearInterval(holdTimer);
    pauseOverlay.classList.add("show");
  }

  function resumeGame() {
    if (!paused || gameOver) return;
    paused = false;
    lastTime = performance.now();
    pauseOverlay.classList.remove("show");
  }

  function restart() {
    clearInterval(holdTimer);
    grid = emptyGrid();
    score = 0; level = 1; dropCounter = 0;
    queue = [randPiece(), randPiece(), randPiece()];
    nextPiece = queue.shift();
    piece = makePiece(nextPiece, 3, -2);
    paused = false; gameOver = false; started = true;
    gameoverOverlay.classList.remove("show");
    pauseOverlay.classList.remove("show");
    updateHud(); drawNext();

    lastTime = performance.now();
    if (rafId === null) loop(performance.now());
  }

  function move(dx, dy) {
    if (paused || gameOver || !started) return;
    if (!collides(piece, dx, dy)) {
      piece.col += dx; piece.row += dy;
      sfxMove();
    } else if (dy > 0) lockPiece();
  }

  function rotate() {
    if (paused || gameOver || !started) return;
    const c = piece.cells.map(([x, y]) => [y, -x]);
    for (const off of [[0,0],[1,0],[-1,0],[0,1]]) {
      const p2 = { ...piece, cells: c.map(([x,y]) => [x+off[0], y+off[1]]) };
      if (!collides(p2, 0, 0)) { piece.cells = c; break; }
    }
    sfxRotate();
  }

  // ---------- Drawing ----------
  function drawCell(x, y, type, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = COLORS[type];
    const px = x * CELL, py = y * CELL;
    ctx.fillRect(px + 1, py + 1, CELL - 2, CELL - 2);
    ctx.restore();
  }

  function drawNext() {
    nctx.clearRect(0, 0, NEXT_W, NEXT_H);
    if (!nextPiece) return;
    const cells = SHAPES[nextPiece];
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const [x, y] of cells) { minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y); }
    const sc = NEXT_W / ((maxX - minX + 1) * 2.6);
    for (const [x, y] of cells) {
      nctx.fillStyle = COLORS[nextPiece];
      nctx.fillRect((x - minX) * sc + 4, (y - minY) * sc + 4, sc - 2, sc - 2);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    // grid lines
    ctx.strokeStyle = "rgba(255,255,255,0.05)";
    for (let x = 1; x < COLS; x++) { ctx.beginPath(); ctx.moveTo(x*CELL+0.5, 0); ctx.lineTo(x*CELL+0.5, H); ctx.stroke(); }
    for (let y = 1; y < ROWS; y++) { ctx.beginPath(); ctx.moveTo(0, y*CELL+0.5); ctx.lineTo(W, y*CELL+0.5); ctx.stroke(); }

    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        if (grid[r][c]) drawCell(c, r, grid[r][c], 1);

    const gy = ghostRow(piece);
    for (const [cx, cy] of piece.cells) {
      ctx.save();
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = COLORS[piece.type];
      const px = (piece.col + cx) * CELL, py = (gy + cy) * CELL;
      if (py >= 0 && py < H && px >= 0 && px < W) ctx.fillRect(px + 1, py + 1, CELL - 2, CELL - 2);
      ctx.restore();
    }

    for (const [cx, cy] of piece.cells) drawCell(piece.col + cx, piece.row + cy, piece.type, 1);
  }

  function updateHud() {
    scoreVal.textContent = score;
    levelVal.textContent = level;
  }

  // ---------- Main loop (UN SOLO bucle rAF con delta-time) ----------
  function loop(time) {
    if (!started) return;
    const delta = time - lastTime;
    lastTime = time;
    dropCounter += delta;
    while (dropCounter >= dropInterval()) {
      dropCounter -= dropInterval();
      move(0, 1);
      if (gameOver) break;
    }
    draw();
    rafId = requestAnimationFrame(loop);
  }

  // ---------- Keyboard ----------
  window.addEventListener("keydown", e => {
    ensureAudio();
    const k = e.key.toLowerCase();
    if (k === "p") { paused ? resumeGame() : pauseGame(); return; }
    if (gameOver) return;
    if (paused) return;
    switch (k) {
      case "arrowleft": case "a": move(-1, 0); break;
      case "arrowright": case "d": move(1, 0); break;
      case "arrowdown": case "w": move(0, 1); break;
      case "arrowup": case "r": rotate(); break;
    }
  });

  // ---------- Touch controls ----------
  const REPEAT_DOWN = 60, REPEAT_H = 120;

  function startRepeat(act) {
    clearInterval(holdTimer);
    if (act === "down") holdTimer = setInterval(() => move(0, 1), REPEAT_DOWN);
    else if (act === "left" || act === "right") holdTimer = setInterval(() => move(act === "left" ? -1 : 1, 0), REPEAT_H);
  }

  const buttons = document.querySelectorAll(".btn[data-act]");
  for (const b of buttons) {
    const act = b.dataset.act;
    b.addEventListener("touchstart", e => {
      e.preventDefault();
      ensureAudio();
      if (gameOver || paused) return;
      b.classList.add("active");
      if (act === "rotate") rotate();
      else startRepeat(act);
    }, { passive: false });
    const stop = () => {
      clearInterval(holdTimer);
      b.classList.remove("active");
    };
    b.addEventListener("touchend", stop, { passive: false });
    b.addEventListener("touchcancel", stop, { passive: false });
  }

  boardCanvas.addEventListener("click", () => { ensureAudio(); paused ? resumeGame() : pauseGame(); });
  restartBtn.addEventListener("click", () => { ensureAudio(); restart(); });

  // ---------- Init ----------
  try { muted = localStorage.getItem(MUTE_KEY) === "true"; } catch (e) {}
  if (muted) muteBtn.textContent = "🔇";
  restart();
})();
</script>
</body>
</html>
