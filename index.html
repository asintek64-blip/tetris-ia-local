<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a12;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        .game-container {
            display: flex;
            gap: 20px;
            padding: 20px;
            position: relative;
        }
        canvas {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.3), inset 0 0 50px rgba(0, 0, 0, 0.5);
            background: linear-gradient(180deg, #0d0d1a 0%, #1a1a2e 100%);
        }
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .panel {
            background: linear-gradient(145deg, #1a1a3e, #151530);
            padding: 20px;
            border-radius: 15px;
            color: #fff;
            min-width: 160px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 20px rgba(168, 85, 247, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.3);
        }
        .panel h3 {
            margin-bottom: 12px;
            font-size: 16px;
            color: #e94560;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }
        #nextCanvas {
            border: 2px solid rgba(168, 85, 247, 0.4);
            border-radius: 8px;
            background: linear-gradient(145deg, #1a1a2e, #151530);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
        }
        .controls {
            background: linear-gradient(145deg, #1a1a3e, #151530);
            padding: 20px;
            border-radius: 15px;
            color: #fff;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 20px rgba(168, 85, 247, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.3);
        }
        .controls h3 {
            margin-bottom: 12px;
            font-size: 16px;
            color: #e94560;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }
        .controls p {
            font-size: 13px;
            margin: 6px 0;
            color: #aaa;
        }
        .controls kbd {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-family: monospace;
            color: #e94560;
        }
        #gameOver {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 18, 0.95);
            padding: 50px 60px;
            border-radius: 20px;
            text-align: center;
            color: #fff;
            z-index: 100;
            box-shadow: 0 0 60px rgba(233, 69, 96, 0.4), inset 0 0 100px rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(233, 69, 96, 0.5);
        }
        #gameOver h2 {
            color: #e94560;
            margin-bottom: 20px;
            font-size: 36px;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.8);
        }
        #gameOver p {
            font-size: 20px;
            margin-bottom: 25px;
            color: #ccc;
        }
        #restartBtn {
            padding: 15px 40px;
            font-size: 20px;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.5);
        }
        #restartBtn:hover {
            background: linear-gradient(135deg, #ff6b6b, #e94560);
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(233, 69, 96, 0.8);
        }
        #startScreen {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 18, 0.95);
            padding: 60px 80px;
            border-radius: 20px;
            text-align: center;
            color: #fff;
            z-index: 100;
            box-shadow: 0 0 60px rgba(168, 85, 247, 0.4), inset 0 0 100px rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(168, 85, 247, 0.5);
        }
        #startScreen h1 {
            color: #00f0f0;
            margin-bottom: 30px;
            font-size: 48px;
            text-shadow: 0 0 30px rgba(0, 240, 240, 0.8);
            animation: glow 2s ease-in-out infinite alternate;
        }
        @keyframes glow {
            from { text-shadow: 0 0 20px rgba(0, 240, 240, 0.6); }
            to { text-shadow: 0 0 40px rgba(0, 240, 240, 1); }
        }
        #playBtn {
            padding: 18px 50px;
            font-size: 24px;
            background: linear-gradient(135deg, #00f0f0, #00a0a0);
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: all 0.3s ease;
            box-shadow: 0 0 30px rgba(0, 240, 240, 0.5);
        }
        #playBtn:hover {
            background: linear-gradient(135deg, #00a0a0, #00f0f0);
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(0, 240, 240, 0.8);
        }
        #pauseOverlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 50;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        #pauseOverlay h2 {
            font-size: 48px;
            color: #e94560;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.8);
            animation: pulse 1s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        #muteBtn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(168, 85, 247, 0.3);
            border: 2px solid rgba(168, 85, 247, 0.5);
            color: #fff;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            z-index: 10;
        }
        #muteBtn:hover {
            background: rgba(168, 85, 247, 0.6);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
        }
        .line-animation {
            animation: flashLine 0.2s ease-out;
        }
        @keyframes flashLine {
            0% { background-color: rgba(255, 255, 255, 0.8); }
            100% { background-color: transparent; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="board" width="300" height="600"></canvas>
        <div class="sidebar">
            <div class="panel">
                <h3>Siguiente</h3>
                <canvas id="nextCanvas" width="100" height="100"></canvas>
            </div>
            <div class="panel">
                <h3>Puntuación</h3>
                <div id="score">0</div>
            </div>
            <div class="panel">
                <h3>Nivel</h3>
                <div id="level">1</div>
            </div>
            <div class="controls">
                <h3>Controles</h3>
                <p><kbd>←</kbd> <kbd>→</kbd> : Mover</p>
                <p><kbd>↑</kbd> : Rotar</p>
                <p><kbd>↓</kbd> : Bajar rápido</p>
                <p><kbd>P</kbd> : Pausa</p>
                <p><kbd>R</kbd> : Reiniciar</p>
            </div>
        </div>
    </div>
    <div id="startScreen">
        <h1>TETRIS</h1>
        <button id="playBtn">JUGAR</button>
    </div>
    <div id="pauseOverlay">
        <h2>PAUSA</h2>
        <p>Presiona P para continuar</p>
    </div>
    <div id="gameOver">
        <h2>GAME OVER</h2>
        <p>Puntuación final: <span id="finalScore">0</span></p>
        <p>Mejor: <span id="bestScore">0</span></p>
        <br>
        <button id="restartBtn">Jugar de nuevo</button>
    </div>
    <button id="muteBtn">🔊</button>
    <script>
        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 30;

        const canvas = document.getElementById('board');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('nextCanvas');
        const nextCtx = nextCanvas.getContext('2d');

        const PIECES = [
            { shape: [[1, 1, 1, 1]], color: '#00f0f0', name: 'I' },
            { shape: [[1, 1, 1], [0, 1, 0]], color: '#0000f0', name: 'T' },
            { shape: [[1, 1], [1, 1]], color: '#f0f000', name: 'O' },
            { shape: [[1, 1, 1], [1, 1, 1]], color: '#f00000', name: 'S' },
            { shape: [[0, 1, 1], [1, 1, 0]], color: '#00f000', name: 'Z' },
            { shape: [[1, 0, 0], [1, 1, 1]], color: '#f0a000', name: 'J' },
            { shape: [[0, 0, 1], [1, 1, 1]], color: '#a000f0', name: 'L' }
        ];

        let board = [];
        let score = 0;
        let level = 1;
        let gameOver = false;
        let paused = false;
        let piece = null;
        let nextPiece = null;
        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let animationTime = 0;

        // Audio System
        let audioEnabled = true;
        let audioContext = null;

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        function playSound(type) {
            if (!audioEnabled || !audioContext) return;

            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            const now = audioContext.currentTime;

            switch(type) {
                case 'move':
                    oscillator.frequency.setValueAtTime(200, now);
                    oscillator.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                    gainNode.gain.setValueAtTime(0.1, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    oscillator.start(now);
                    oscillator.stop(now + 0.1);
                    break;

                case 'rotate':
                    oscillator.frequency.setValueAtTime(300, now);
                    oscillator.frequency.exponentialRampToValueAtTime(500, now + 0.15);
                    gainNode.gain.setValueAtTime(0.1, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    oscillator.start(now);
                    oscillator.stop(now + 0.15);
                    break;

                case 'lock':
                    oscillator.type = 'square';
                    oscillator.frequency.setValueAtTime(150, now);
                    oscillator.frequency.exponentialRampToValueAtTime(50, now + 0.2);
                    gainNode.gain.setValueAtTime(0.15, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    oscillator.start(now);
                    oscillator.stop(now + 0.2);
                    break;

                case 'line':
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(400, now);
                    oscillator.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                    gainNode.gain.setValueAtTime(0.2, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    oscillator.start(now);
                    oscillator.stop(now + 0.3);
                    break;

                case 'lineClear':
                    oscillator.type = 'triangle';
                    oscillator.frequency.setValueAtTime(523.25, now); // C5
                    oscillator.frequency.setValueAtTime(659.25, now + 0.1); // E5
                    oscillator.frequency.setValueAtTime(783.99, now + 0.2); // G5
                    oscillator.frequency.setValueAtTime(1046.50, now + 0.3); // C6
                    gainNode.gain.setValueAtTime(0.25, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                    oscillator.start(now);
                    oscillator.stop(now + 0.6);
                    break;

                case 'ghost':
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(100, now);
                    gainNode.gain.setValueAtTime(0.05, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                    oscillator.start(now);
                    oscillator.stop(now + 0.05);
                    break;

                case 'gameOver':
                    oscillator.type = 'sawtooth';
                    oscillator.frequency.setValueAtTime(300, now);
                    oscillator.frequency.exponentialRampToValueAtTime(50, now + 1);
                    gainNode.gain.setValueAtTime(0.3, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 1);
                    oscillator.start(now);
                    oscillator.stop(now + 1);
                    break;
            }
        }

        function createBoard() {
            board = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
        }

function createPiece() {
    const index = Math.floor(Math.random() * PIECES.length);
    const piece = {
        shape: PIECES[index].shape.map(row => [...row]),
        color: PIECES[index].color,
        x: Math.floor(COLS / 2) - 1,
        y: 0,
        originalColor: PIECES[index].color
    };
    
    if (!isValidMove(piece.x, piece.y, piece.shape)) {
        gameOver = true;
        playSound('gameOver');
        showGameOver();
    }
    
    return piece;
}

        function drawBlock(x, y, color, context = ctx, alpha = 1) {
            const gradient = context.createLinearGradient(
                x * BLOCK_SIZE, y * BLOCK_SIZE,
                x * BLOCK_SIZE + BLOCK_SIZE, y * BLOCK_SIZE + BLOCK_SIZE
            );
            gradient.addColorStop(0, color);
            gradient.addColorStop(0.5, adjustColor(color, -40));
            gradient.addColorStop(1, adjustColor(color, -60));
            
            context.fillStyle = gradient;
            context.globalAlpha = alpha;
            context.fillRect(x * BLOCK_SIZE + 1, y * BLOCK_SIZE + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
            
            context.strokeStyle = adjustColor(color, -20);
            context.lineWidth = 1;
            context.strokeRect(x * BLOCK_SIZE + 1, y * BLOCK_SIZE + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
            
            context.globalAlpha = 1;
        }

        function adjustColor(color, amount) {
            const hex = color.replace('#', '');
            const r = Math.min(255, Math.max(0, parseInt(hex.substr(0, 2), 16) + amount));
            const g = Math.min(255, Math.max(0, parseInt(hex.substr(2, 2), 16) + amount));
            const b = Math.min(255, Math.max(0, parseInt(hex.substr(4, 2), 16) + amount));
            return `rgb(${r}, ${g}, ${b})`;
        }

        function drawBoard() {
            ctx.fillStyle = '#0a0a12';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            for (let x = 0; x <= COLS; x++) {
                ctx.beginPath();
                ctx.moveTo(x * BLOCK_SIZE, 0);
                ctx.lineTo(x * BLOCK_SIZE, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= ROWS; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y * BLOCK_SIZE);
                ctx.lineTo(canvas.width, y * BLOCK_SIZE);
                ctx.stroke();
            }

            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (board[y][x]) {
                        drawBlock(x, y, board[y][x]);
                    }
                }
            }
        }

        function drawGhostPiece() {
            if (!piece || gameOver || paused) return;

            let ghostY = piece.y;
            while (isValidMove(piece.x, ghostY + 1)) {
                ghostY++;
            }

            for (let y = 0; y < piece.shape.length; y++) {
                for (let x = 0; x < piece.shape[y].length; x++) {
                    if (piece.shape[y][x]) {
                        const alpha = 0.2 + Math.sin(animationTime * 0.1) * 0.05;
                        drawBlock(piece.x + x, ghostY + y, piece.color, ctx, alpha);
                    }
                }
            }
        }

        function drawPiece() {
            if (!piece || gameOver || paused) return;
            for (let y = 0; y < piece.shape.length; y++) {
                for (let x = 0; x < piece.shape[y].length; x++) {
                    if (piece.shape[y][x]) {
                        drawBlock(piece.x + x, piece.y + y, piece.color);
                    }
                }
            }
        }

        function drawNextPiece() {
            nextCtx.fillStyle = '#0a0a12';
            nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);

            if (!nextPiece) return;

            const offsetX = (nextCanvas.width / BLOCK_SIZE - nextPiece.shape[0].length) / 2;
            const offsetY = (nextCanvas.height / BLOCK_SIZE - nextPiece.shape.length) / 2;

            for (let y = 0; y < nextPiece.shape.length; y++) {
                for (let x = 0; x < nextPiece.shape[y].length; x++) {
                    if (nextPiece.shape[y][x]) {
                        drawBlock(offsetX + x, offsetY + y, nextPiece.color, nextCtx);
                    }
                }
            }
        }

        function rotate(piece) {
            const shape = piece.shape;
            const rows = shape.length;
            const cols = shape[0].length;
            const rotated = Array(cols).fill(null).map(() => Array(rows).fill(0));

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    rotated[cols - 1 - x][y] = shape[y][x];
                }
            }

            const original = JSON.stringify(shape);
            piece.shape = rotated;

            for (let x = -2; x < COLS + 2; x++) {
                for (let y = 0; y < ROWS; y++) {
                    if (piece.shape[y] && piece.shape[y][x]) {
                        if (!isValidMove(piece.x, piece.y)) {
                            piece.shape = JSON.parse(original);
                            break;
                        }
                    }
                }
            }
            playSound('rotate');
        }

        function isValidMove(x, y, shape = piece.shape) {
            for (let py = 0; py < shape.length; py++) {
                for (let px = 0; px < shape[py].length; px++) {
                    if (shape[py][px]) {
                        const newX = x + px;
                        const newY = y + py;
                        if (newX < 0 || newX >= COLS || newY >= ROWS) {
                            return false;
                        }
                        if (newY >= 0 && board[newY][newX]) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }

        function placePiece() {
            for (let y = 0; y < piece.shape.length; y++) {
                for (let x = 0; x < piece.shape[y].length; x++) {
                    if (piece.shape[y][x]) {
                        const boardY = piece.y + y;
                        if (boardY < 0) {
                            gameOver = true;
                            playSound('gameOver');
                            showGameOver();
                            return;
                        }
                        if (boardY >= 0) {
                            board[boardY][piece.x + x] = piece.color;
                        }
                    }
                }
            }

            playSound('lock');

            let linesCleared = 0;
            for (let y = ROWS - 1; y >= 0; y--) {
                let isFull = true;
                for (let x = 0; x < COLS; x++) {
                    if (!board[y][x]) {
                        isFull = false;
                        break;
                    }
                }
                if (isFull) {
                    board.splice(y, 1);
                    board.unshift(Array(COLS).fill(0));
                    linesCleared++;
                    y++;
                }
            }

            if (linesCleared > 0) {
                const points = [0, 100, 300, 500, 800];
                score += points[linesCleared] * level;
                level = Math.floor(score / 1000) + 1;
                dropInterval = Math.max(100, 1000 - (level - 1) * 100);
                updateScore();
                playSound('lineClear');
            }

            piece = nextPiece;
            nextPiece = createPiece();
            drawNextPiece();
        }

        function showGameOver() {
            const finalScore = document.getElementById('finalScore');
            const bestScore = localStorage.getItem('tetrisBestScore') || 0;
            finalScore.textContent = score;
            document.getElementById('bestScore').textContent = bestScore;
            document.getElementById('gameOver').style.display = 'block';
            document.getElementById('pauseOverlay').style.display = 'none';
        }

        function updateScore() {
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
        }

        function togglePause() {
            if (gameOver) return;
            paused = !paused;
            const overlay = document.getElementById('pauseOverlay');
            if (paused) {
                overlay.style.display = 'flex';
                playSound('rotate');
            } else {
                overlay.style.display = 'none';
                lastTime = performance.now();
                requestAnimationFrame(gameLoop);
            }
        }

        function update() {
            if (gameOver || paused) return;

            dropCounter += (lastTime - dropCounter) * 0.016;
            if (dropCounter >= dropInterval) {
                dropCounter = 0;
                if (!isValidMove(piece.x, piece.y)) {
                    piece.y--;
                    placePiece();
                } else {
                    piece.y++;
                }
            }
        }

        function gameLoop(time) {
            lastTime = time;
            animationTime = time;
            update();
            drawBoard();
            drawGhostPiece();
            drawPiece();
            requestAnimationFrame(gameLoop);
        }

        document.addEventListener('keydown', (e) => {
            if (gameOver) return;

            switch(e.key) {
                case 'ArrowLeft':
                    if (isValidMove(piece.x - 1, piece.y)) {
                        piece.x--;
                        playSound('move');
                    }
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                    if (isValidMove(piece.x + 1, piece.y)) {
                        piece.x++;
                        playSound('move');
                    }
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                    if (isValidMove(piece.x, piece.y + 1)) {
                        piece.y++;
                        playSound('move');
                        drawBoard();
                        drawGhostPiece();
                        drawPiece();
                    }
                    e.preventDefault();
                    break;
                case 'ArrowUp':
                    rotate(piece);
                    drawBoard();
                    drawGhostPiece();
                    drawPiece();
                    e.preventDefault();
                    break;
                case 'p':
                case 'P':
                    togglePause();
                    break;
                case 'r':
                case 'R':
                    startGame();
                    break;
            }
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            document.getElementById('gameOver').style.display = 'none';
            startGame();
        });

        document.getElementById('playBtn').addEventListener('click', () => {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameOver').style.display = 'none';
            initAudio();
            startGame();
        });

        document.getElementById('muteBtn').addEventListener('click', (e) => {
            audioEnabled = !audioEnabled;
            e.target.textContent = audioEnabled ? '🔊' : '🔇';
            e.target.style.background = audioEnabled 
                ? 'rgba(168, 85, 247, 0.3)' 
                : 'rgba(233, 69, 96, 0.3)';
            e.target.style.boxShadow = audioEnabled 
                ? '0 0 20px rgba(168, 85, 247, 0.5)' 
                : '0 0 20px rgba(233, 69, 96, 0.3)';
        });

        function startGame() {
            const bestScore = localStorage.getItem('tetrisBestScore') || 0;
            document.getElementById('bestScore').textContent = bestScore;
            document.getElementById('gameOver').style.display = 'none';
            
            gameOver = false;
            paused = false;
            score = 0;
            level = 1;
            dropInterval = 1000;
            lastTime = performance.now();
            dropCounter = 0;
            createBoard();
            piece = createPiece();
            nextPiece = createPiece();
            drawNextPiece();
            drawBoard();
            drawPiece();
            drawGhostPiece();
            updateScore();
            requestAnimationFrame(gameLoop);
        }

        createBoard();
        piece = createPiece();
        nextPiece = createPiece();
        drawNextPiece();
        drawBoard();
        drawPiece();
        document.getElementById('startScreen').style.display = 'block';
    </script>
</body>
</html>
